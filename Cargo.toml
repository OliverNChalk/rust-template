[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
readme = "README.md"
authors = ["Oliver Chalk"]
license = "UNLICENSED"

[workspace.lints.clippy]
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
disallowed_methods = "warn"                  # See `clippy.toml`.
exit = "warn"
expect_used = "warn"
get_first = "allow"
inline-always = "allow"
len_without_is_empty = "allow"
manual_assert_eq = "warn"
match_bool = "allow"
min_ident_chars = "warn"
missing_const_for_fn = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless-raw-string-hashes = "allow"
new_without_default = "allow"
non_ascii_literal = "warn"
pedantic = { level = "warn", priority = -1 }
print_stdout = "warn"
redundant_type_annotations = "warn"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
todo = "warn"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "warn"
use_self = "warn"

[workspace.lints.rust]
non_ascii_idents = "warn"

[workspace.dependencies]
clap = "4.2.7"
clap_complete = "4.3.0"
dotenvy = "0.15.7"
futures = "0.3.31"
metrics-nats-exporter = { git = "https://github.com/OliverNChalk/metrics-nats-exporter" }
serde = "1.0.226"
serde_yaml = "0.9.34"
tokio = "1.28.2"
toolbox = { git = "https://github.com/OliverNChalk/toolbox-rs.git", version = "0.2.0" }
tracing = "0.1.41"
vergen-git2 = "1.0.7"

[profile.release]
opt-level = 3
debug = true

[profile.paranoid]
inherits = "release"
overflow-checks = true
debug-assertions = true

[profile.paranoid.package."*"]
overflow-checks = false
debug-assertions = false

[profile.performance]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
